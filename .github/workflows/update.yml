name: Update Sensex Tracker

on:
  schedule:
    # 3 runs on trading days (times in UTC; IST = UTC+5:30):
    - cron: "0 4 * * 1-5"     # 09:30 IST — pre/at market open
    - cron: "30 7 * * 1-5"    # 13:00 IST — midday
    - cron: "0 11 * * 1-5"    # 16:30 IST — after close
  push:
    paths:
      - "holdings.csv"        # rebuild immediately when you edit your portfolio
      - "watchlist.csv"       # …or your watchlist
      - "discipline.csv"
      - "journal.csv"
      - "violations.csv"
      - "floor.csv"
      - "sells.csv"
      - "scripts/**"
  workflow_dispatch:          # manual run from the Actions tab

permissions:
  contents: write             # allows the job to commit the refreshed dashboard

concurrency:
  group: tracker-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build dashboard (live data)
        run: python scripts/update.py

      - name: Send alerts (Telegram / email if configured)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python scripts/alert.py

      - name: Commit updated dashboard
        run: |
          git config user.name  "sensex-bot"
          git config user.email "actions@github.com"
          git pull --rebase origin main || true
          git add docs/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Deploy to Cloudflare Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@3 pages project create harrys-sensex-tracker --production-branch=main 2>/dev/null || true
          npx wrangler@3 pages deploy docs --project-name=harrys-sensex-tracker --branch=main --commit-dirty=true
